<meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1280px;height:400px;background:#0a0d0b;
  font-family:ui-monospace,'DejaVu Sans Mono',monospace;-webkit-font-smoothing:none;
  display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.grid{position:absolute;inset:0;
  background:repeating-linear-gradient(90deg,#ffffff06 0 1px,transparent 1px 44px),
             repeating-linear-gradient(0deg,#ffffff05 0 1px,transparent 1px 44px)}
.beam{position:absolute;left:300px;top:-40px;width:340px;height:480px;
  background:linear-gradient(#ffd93b26,transparent 72%);
  clip-path:polygon(42% 0,58% 0,100% 100%,0 100%)}
.wrap{position:relative;display:flex;align-items:center;gap:56px;z-index:2}
/* the cage */
.cage{position:relative;width:210px;height:250px}
.hook{position:absolute;left:99px;top:0;width:6px;height:30px;background:#3a4038}
.ring{position:absolute;left:88px;top:-8px;width:28px;height:16px;border:5px solid #3a4038;
  border-radius:50%;border-bottom-color:transparent}
.top{position:absolute;left:26px;top:28px;width:158px;height:16px;
  background:linear-gradient(#5a6357,#333a31);border-radius:8px 8px 0 0;border:3px solid #10140f}
.bar{position:absolute;top:42px;width:5px;height:158px;background:#4a5346;box-shadow:0 0 0 1px #10140f}
.base{position:absolute;left:20px;top:198px;width:170px;height:20px;
  background:linear-gradient(#5a6357,#2b3129);border-radius:0 0 10px 10px;border:3px solid #10140f}
.floorbar{position:absolute;left:32px;top:192px;width:146px;height:5px;background:#3a4038}
.glow{position:absolute;left:18px;top:34px;width:174px;height:190px;
  background:radial-gradient(ellipse,#ffd93b1f,transparent 68%)}
/* the bird */
.bird{position:absolute;left:66px;top:96px;width:78px;height:74px;z-index:3}
.body{position:absolute;left:6px;top:16px;width:56px;height:44px;border-radius:24px 26px 18px 20px;
  background:#ffd93b;box-shadow:inset 0 -7px 0 #d9a821, inset 0 6px 0 #ffe98a, 0 0 26px #ffd93b55}
.head{position:absolute;left:38px;top:0;width:36px;height:32px;border-radius:16px;
  background:#ffe14f;box-shadow:inset 0 -4px 0 #d9a821}
.tuft{position:absolute;left:52px;top:-7px;width:5px;height:11px;background:#ffe14f;border-radius:3px;
  transform:rotate(-16deg)}
.tuft.b{left:59px;transform:rotate(10deg);height:9px}
.eye{position:absolute;left:60px;top:11px;width:7px;height:7px;border-radius:50%;background:#171a15}
.eye:after{content:"";position:absolute;left:2px;top:1px;width:2px;height:2px;background:#fff;border-radius:50%}
.beak{position:absolute;left:72px;top:16px;width:0;height:0;
  border-left:12px solid #ff8a2b;border-top:6px solid transparent;border-bottom:6px solid transparent}
.wing{position:absolute;left:16px;top:28px;width:30px;height:20px;border-radius:14px 6px 14px 8px;
  background:#f4c62c;box-shadow:inset 0 -3px 0 #cf9c1d}
.tail{position:absolute;left:-4px;top:24px;width:20px;height:12px;background:#f4c62c;
  border-radius:6px 0 0 6px;transform:rotate(-12deg)}
.leg{position:absolute;top:58px;width:3px;height:12px;background:#ff8a2b}
.foot{position:absolute;top:69px;width:11px;height:3px;background:#ff8a2b}
.perch{position:absolute;left:34px;top:172px;width:100px;height:6px;background:#3a4038;border-radius:3px}
/* words */
.txt{position:relative}
.name{font-size:82px;letter-spacing:10px;color:#ffd93b;line-height:80px;
  text-shadow:0 0 26px #ffd93b55, 4px 4px 0 #0a0d0b}
.sub{margin-top:14px;font-size:17px;letter-spacing:3px;color:#9aa694}
.rules{margin-top:24px;display:flex;flex-direction:column;gap:5px}
.r{display:flex;align-items:center;gap:10px;font-size:13px;letter-spacing:1px}
.r i{width:9px;height:9px;border-radius:50%}
.r.leave{color:#ff6b5e}.r.leave i{background:#ff6b5e;box-shadow:0 0 8px #ff6b5e}
.r.watch{color:#ffc14f}.r.watch i{background:#ffc14f;box-shadow:0 0 8px #ffc14f}
.foot2{position:absolute;left:0;right:0;bottom:16px;text-align:center;font-size:13px;
  letter-spacing:4px;color:#5f6a59;z-index:3}
.vig{position:absolute;inset:0;z-index:5;pointer-events:none;
  background:radial-gradient(ellipse at 42% 50%,transparent 52%,#000000aa 100%)}
</style>
<div class="grid"></div><div class="beam"></div>
<div class="wrap">
  <div class="cage">
    <div class="ring"></div><div class="hook"></div><div class="glow"></div>
    <div class="top"></div>
    <div class="bar" style="left:34px"></div><div class="bar" style="left:62px"></div>
    <div class="bar" style="left:90px"></div><div class="bar" style="left:118px"></div>
    <div class="bar" style="left:146px"></div><div class="bar" style="left:174px"></div>
    <div class="bird">
      <div class="tail"></div><div class="body"></div><div class="wing"></div>
      <div class="tuft"></div><div class="tuft b"></div>
      <div class="head"></div><div class="eye"></div><div class="beak"></div>
      <div class="leg" style="left:24px"></div><div class="leg" style="left:38px"></div>
      <div class="foot" style="left:20px"></div><div class="foot" style="left:34px"></div>
    </div>
    <div class="perch"></div>
    <div class="floorbar"></div><div class="base"></div>
  </div>
  <div class="txt">
    <div class="name">CANARY</div>
    <div class="sub">THE WATCHTOWER FOR ROBINHOOD CHAIN</div>
    <div class="rules">
      <div class="r leave"><i></i>LEAVE &nbsp;the deployer is selling</div>
      <div class="r leave"><i></i>LEAVE &nbsp;liquidity fell 30.9%</div>
      <div class="r watch"><i></i>WATCH &nbsp;creator fees were claimed</div>
    </div>
  </div>
</div>
<div class="foot2">READ ONLY · NO KEY · IT CANNOT SPEND</div>
<div class="vig"></div>
